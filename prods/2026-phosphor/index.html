function shd(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));return s}

layout(location=0) in vec2 p; out vec2 uv; void main(){uv=p*.5+.5;gl_Position=vec4(p,0,1);}`;

// The beam: each instance is one segment; the fragment computes the exact
// integral of a gaussian spot moving along the segment -> seamless joins.
const beamP=prog(`#version 300 es
layout(location=0) in vec2 q; layout(location=1) in vec4 seg; layout(location=2) in vec4 cw;
uniform float uAsp; uniform float uPx;
out vec2 vP; flat out vec2 vA; flat out vec2 vB; flat out vec3 vC; flat out float vW;
void main(){
  vec2 a=seg.xy,b=seg.zw,d=b-a; float L=length(d); vec2 t=L>1e-6?d/L:vec2(1,0); vec2 n=vec2(-t.y,t.x);
  float w=max(cw.w,uPx*1.1); float e=w*3.2;
  vec2 P=mix(a-t*e,b+t*e,q.x)+n*e*q.y;
  vP=P;vA=a;vB=b;vC=cw.rgb;vW=w; gl_Position=vec4(P.x/uAsp,P.y,0,1);
}`,`#version 300 es
precision highp float;
in vec2 vP; flat in vec2 vA; flat in vec2 vB; flat in vec3 vC; flat in float vW; out vec4 o; uniform float uBG;
float erf(float x){float s=sign(x),a=abs(x);float t=1.+(0.278393+(0.230389+(0.000972+0.078108*a)*a)*a)*a;t*=t;return s-s/(t*t);}
float beam(float al,float pe,float L,float s){
  if(L<1e-6) return exp(-(al*al+pe*pe)/(s*s));
  return exp(-pe*pe/(s*s))*(erf(al/s)-erf((al-L)/s))*.5;}
void main(){
  vec2 ba=vB-vA; float L=length(ba); vec2 t=L>1e-6?ba/L:vec2(1,0); vec2 pa=vP-vA;
  float al=dot(pa,t), pe=dot(pa,vec2(-t.y,t.x));
  float g=beam(al,pe,L,vW)*.55 + beam(al,pe,L,vW*.33)*1.1 + beam(al,pe,L,vW*2.6)*.06;
  o=vec4(vC*g*uBG,1);
}`);

// phosphor persistence: trail = max(prev*decay (optionally zoomed/rotated), fresh)
const fbP=prog(VQ,`#version 300 es
precision highp float; in vec2 uv; out vec4 o;
uniform sampler2D uPrev,uFresh; uniform float uDecay,uZoom,uRot,uAsp;
void main(){ vec2 p=uv-.5; p.x*=uAsp; float c=cos(uRot),s=sin(uRot); p=mat2(c,s,-s,c)*p/uZoom; p.x/=uAsp; p+=.5;
  vec3 pr=texture(uPrev,p).rgb*uDecay; if(p.x<0.||p.y<0.||p.x>1.||p.y>1.)pr=vec3(0);
  vec3 fr=texture(uFresh,uv).rgb; o=vec4(max(pr,fr),1);}`);

void main(){vec3 c=texture(uT,uv+uTx*vec2(-1,-1)).rgb+texture(uT,uv+uTx*vec2(1,-1)).rgb+texture(uT,uv+uTx*vec2(-1,1)).rgb+texture(uT,uv+uTx*vec2(1,1)).rgb;o=vec4(c*.25,1);}`);

precision highp float; in vec2 uv; out vec4 o; uniform sampler2D uT; uniform vec2 uD;
void main(){vec3 c=texture(uT,uv).rgb*.227;
 c+=(texture(uT,uv+uD*1.384).rgb+texture(uT,uv-uD*1.384).rgb)*.316;
 c+=(texture(uT,uv+uD*3.230).rgb+texture(uT,uv-uD*3.230).rgb)*.070; o=vec4(c,1);}`);

float h21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
void main(){
  vec2 c=uv*2.-1.; float r2=dot(c,c);
  vec2 q=c*(1.+.035*uTube*r2);
  q*=1.-uPunch*.035; q+=uShake;
  float rr=length(q),R=uShock*1.75;
  float sw=uShockA*exp(-pow((rr-R)/.1,2.))*max(0.,1.-uShock/1.15);
  q-=(rr>1e-4?q/rr:vec2(0))*sw*.08;
  float tear=uNoise*step(.82,h21(vec2(floor(q.y*14.+uT*3.),floor(uT*12.))));
  q.x+=tear*.06*sin(q.y*30.+uT*50.);

  vec2 s=q; s.y/=max(uPY,1e-4); s.x/=max(uPX,1e-4);
  vec2 t=s*.5+.5;
  float tube=mix(1.,smoothstep(1.005,.985,edge),uTube);
  float ins=step(abs(s.x),1.)*step(abs(s.y),1.);
  vec2 ca=(t-.5)*(.0035+uSplit*.025+uPunch*.004)+vec2(uSplit*.006,0);
  vec3 col=vec3(texture(uA,t+ca).r,texture(uA,t).g,texture(uA,t-ca).b);
  col+=(texture(uB1,t).rgb*.55+texture(uB2,t).rgb*.75)*(1.+uPunch*.45);

    if(si===9)hudA=sstep(0,2,lt);
    hud(T,si,hudA*(inTr?m:1));
    if((si===9&&lt>2.7)||si===10)scroller(T,si===10?-.76:-.6,.072,si===9?sstep(2.7,4,lt):1);
    TG=tMain;const ctx={t:T,lt,dt};
    if(inTr){const pc={t:T,lt:T-P0.t,dt};morph(()=>SCN[si-1](pc),()=>SCN[si](ctx),m,.12,T)}
    else SCN[si](ctx);
    pw=power(T);noise=noiseAt(T);
    TG=tHud;if(T>END+.6&&state==='end'){pw=[1,1,1];col(.5);wid(.0026);text('PRESS R TO REPLAY',0,0,.035,{c:1,p:sstep(END+.6,END+1.6,T)})}
  }else if(state==='pre'){prm.g=.14*sstep(.6,2,preT);graticule(prm.g);TG=tMain;sPre({t:preT,lt:preT,dt});pw=power(0)}
  else{const p=.6+.4*Math.sin(now/300);col(.9*p);wid(.004);dot(0,0);wid(.0024);col(.55);
    if(state==='load')text('RECEIVING SIGNAL '+Math.floor(loadP*100)+'%',0,-.12,.03,{c:1});
    else{text('CLICK TO POWER ON',0,-.12,.032,{c:1,tr:1.2});col(.3);text('HEADPHONES + FULLSCREEN RECOMMENDED   F = FULLSCREEN',0,-.2,.022,{c:1});
      col(.45);text('WARNING: FLASHING LIGHTS   M = REDUCED FLASHING '+(CALM?'(ON)':'(OFF)'),0,-.27,.022,{c:1})}
    prm.tint=SEC[0].tint;prm.rgb=0;prm.dec=.8;prm.z=1;prm.r=0}
  if(state!=='play'&&state!=='end'){FX.tube=1;FX.age=99;FX.punch=FX.split=0;FX.bg=1}
  render(dt,pw,noise,now)}

function bindTex(u,t,unit){gl.activeTexture(gl.TEXTURE0+unit);gl.bindTexture(gl.TEXTURE_2D,t);gl.uniform1i(u,unit)}
function quad(){gl.bindVertexArray(vaoQ);gl.drawArrays(gl.TRIANGLE_STRIP,0,4)}
function beams(fbo,t,bg){gl.bindFramebuffer(gl.FRAMEBUFFER,fbo.f);gl.viewport(0,0,W,H);gl.clearColor(0,0,0,1);gl.clear(gl.COLOR_BUFFER_BIT);
  if(t.n){gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE);gl.useProgram(beamP.p);gl.uniform1f(beamP.u.uAsp,ASP);gl.uniform1f(beamP.u.uPx,2/H);gl.uniform1f(beamP.u.uBG,bg);
    gl.bindBuffer(gl.ARRAY_BUFFER,instBuf);gl.bufferSubData(gl.ARRAY_BUFFER,0,t.d,0,t.n*8);
    gl.bindVertexArray(vaoB);gl.drawArraysInstanced(gl.TRIANGLE_STRIP,0,4,t.n);gl.disable(gl.BLEND)}}
function render(dt,pw,noise,now){
  beams(ovl,tHud,1);beams(fresh,tMain,FX.bg);
  const k=dt*60,dec=Math.pow(prm.dec,k),z=Math.pow(prm.z,k),r=prm.r*k;
  const A=trail[cur],B=trail[1-cur];cur=1-cur;
  gl.bindFramebuffer(gl.FRAMEBUFFER,B.f);gl.useProgram(fbP.p);bindTex(fbP.u.uPrev,A.t,0);bindTex(fbP.u.uFresh,fresh.t,1);
  gl.uniform1f(fbP.u.uDecay,dec);gl.uniform1f(fbP.u.uZoom,z);gl.uniform1f(fbP.u.uRot,r);gl.uniform1f(fbP.u.uAsp,ASP);quad();
  gl.viewport(0,0,b1.w,b1.h);gl.bindFramebuffer(gl.FRAMEBUFFER,b1.f);gl.useProgram(downP.p);bindTex(downP.u.uT,B.t,0);gl.uniform2f(downP.u.uTx,1/W,1/H);quad();
  gl.useProgram(blurP.p);
  for(let it=0;it<2;it++){gl.bindFramebuffer(gl.FRAMEBUFFER,b2.f);bindTex(blurP.u.uT,b1.t,0);gl.uniform2f(blurP.u.uD,1.4/b1.w,0);quad();
    gl.bindFramebuffer(gl.FRAMEBUFFER,b1.f);bindTex(blurP.u.uT,b2.t,0);gl.uniform2f(blurP.u.uD,0,1.4/b1.h);quad()}
  gl.viewport(0,0,b3.w,b3.h);gl.bindFramebuffer(gl.FRAMEBUFFER,b3.f);gl.useProgram(downP.p);bindTex(downP.u.uT,b1.t,0);gl.uniform2f(downP.u.uTx,1/b1.w,1/b1.h);quad();
  gl.useProgram(blurP.p);
  for(let it=0;it<2;it++){gl.bindFramebuffer(gl.FRAMEBUFFER,b4.f);bindTex(blurP.u.uT,b3.t,0);gl.uniform2f(blurP.u.uD,1.5/b3.w,0);quad();
    gl.bindFramebuffer(gl.FRAMEBUFFER,b3.f);bindTex(blurP.u.uT,b4.t,0);gl.uniform2f(blurP.u.uD,0,1.5/b3.h);quad()}
  gl.viewport(0,0,1,1);gl.bindFramebuffer(gl.FRAMEBUFFER,exF.f);gl.useProgram(exP.p);bindTex(exP.u.uT,b3.t,0);quad();
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.viewport(0,0,W,H);gl.useProgram(finP.p);
  bindTex(finP.u.uA,B.t,0);bindTex(finP.u.uB1,b1.t,1);bindTex(finP.u.uB2,b3.t,2);bindTex(finP.u.uO,ovl.t,3);bindTex(finP.u.uEx,exF.t,4);
  gl.uniform2f(finP.u.uRes,W,H);gl.uniform1f(finP.u.uT,now/1000);gl.uniform1f(finP.u.uPX,pw[0]);gl.uniform1f(finP.u.uPY,pw[1]);gl.uniform1f(finP.u.uGain,pw[2]);
  gl.uniform1f(finP.u.uNoise,noise);gl.uniform1f(finP.u.uPunch,FX.punch);gl.uniform1f(finP.u.uTube,FX.tube);gl.uniform1f(finP.u.uShock,FX.age);gl.uniform1f(finP.u.uShockA,FX.sa);gl.uniform1f(finP.u.uSplit,FX.split);
  gl.uniform2f(finP.u.uShake,(Math.random()-.5)*FX.shake,(Math.random()-.5)*FX.shake);gl.uniform1f(finP.u.uFlash,F.flash);gl.uniform1f(finP.u.uRGB,prm.rgb);gl.uniform3fv(finP.u.uTint,prm.tint);
  gl.uniform1f(finP.u.uRoll,noise>0?(Math.sin(now/700)*.5+.5)*noise*.25:0);quad()}

// ---------------------------------------------------------------- loading + controls
async function loadTrack(){
  if(FAKE){state='ready';return}
  try{const r=await fetch('track.mp3');if(!r.ok)throw new Error(r.status);
    const len=+r.headers.get('content-length')||3972936;const rd=r.body.getReader();const chunks=[];let got=0;
    for(;;){const{done,value}=await rd.read();if(done)break;chunks.push(value);got+=value.length;loadP=Math.min(.99,got/len)}
    const ab=new Uint8Array(got);let o=0;for(const c of chunks){ab.set(c,o);o+=c.length}
    window._ab=ab.buffer;state='ready';loadP=1}
  catch(e){document.getElementById('err').textContent='Could not fetch track.mp3 (opened via file://?). Click to choose the MP3, or drop it here.';state='ready';window._needFile=true}}
async function decodeIfNeeded(){if(!AC)setupAudio();if(AC.state!=='running')await AC.resume();
  if(!buf&&!FAKE){if(!window._ab)return false;buf=await AC.decodeAudioData(window._ab.slice(0))}return true}
async function powerOn(){if(state!=='ready')return;
  if(window._needFile&&!window._ab){document.getElementById('f').click();return}
  if(!FAKE){setupAudio();await AC.resume();const p=AC.decodeAudioData(window._ab.slice(0));preRoll();state='pre';preT=0;
    try{buf=await p}catch(e){state='ready';window._ab=null;window._needFile=true;document.getElementById('err').textContent='Could not decode the track. Click to choose the MP3, or drop it here.'}}
  else{state='pre';preT=0}
  if(T0>0&&!Q.has('pre')){preT=PRE-.01}}
document.getElementById('f').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;window._ab=await f.arrayBuffer();window._needFile=false;document.getElementById('err').textContent='';powerOn()});
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',async e=>{e.preventDefault();const f=e.dataTransfer.files[0];if(!f)return;window._ab=await f.arrayBuffer();window._needFile=false;document.getElementById('err').textContent='';powerOn()});
cv.addEventListener('click',()=>{if(state==='ready')powerOn()});
function seek(t){t=clamp(t,0,END-.5);kPrevT=-9;lastK=lastH=-9;prevB=prevH=0;dMean=hMean=0;dVar=hVar=.001;F.kick=F.hat=0;trail.forEach(o=>{gl.bindFramebuffer(gl.FRAMEBUFFER,o.f);gl.clear(gl.COLOR_BUFFER_BIT)});lastSec=-1;
  if(FAKE)fakeClock=t;else if(buf)playFrom(t);state='play'}
addEventListener('keydown',e=>{
  if(e.key==='m'||e.key==='M')CALM=!CALM;
  if(e.key==='f'||e.key==='F'){try{const r=!document.fullscreenElement?document.documentElement.requestFullscreen?.():document.exitFullscreen?.();r&&r.catch&&r.catch(()=>{})}catch(_){}}
  if(state!=='play'&&state!=='end'){if(e.key===' '||e.key==='Enter')powerOn();if((e.key==='r'||e.key==='R')&&state==='end')seek(0);return}
  if(e.key===' '){paused=!paused;if(AC)paused?AC.suspend():AC.resume()}
  if(e.key==='ArrowRight')seek(songT()+5);if(e.key==='ArrowLeft')seek(songT()-5);
  if(e.key==='r'||e.key==='R')seek(0);
  if(/^[0-9]$/.test(e.key)){const i=e.key==='0'?10:+e.key;seek(SEC[i].t-.01)}
  if(e.key==='c'||e.key==='C')seek(CRED-.01)});
loadTrack();
if(FAKE&&Q.has('auto')){state='play';fakeClock=T0}
requestAnimationFrame(frame);
</script>
