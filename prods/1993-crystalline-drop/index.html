<body>

</div>
<script>
"use strict";
/* ======================= CONFIG ======================= */
const CFG = {
  group: "VENTURE OF XANADU",
  title: "CRYSTALLINE DROP",
  tracks: {
    pt: { file: "protracker.mp3", name: "PROTRACKER EDITION", bpm: 171.60, off: .335,
      cues: [[0,"intro"],[14,"logo"],[29.7,"plasma"],[52,"voxel"],[75,"glenz"],[92,"twister"],[110,"tunnel"],[122,"party"],[133,"fire"],[147.5,"bobs"],[160.5,"dancer"],[188,"bump"],[197,"mini"],[206.5,"finale"],[217.5,"end"]] },
  },

    "REMEMBER THE PARTY 1993 AT HERNING MESSECENTER IN DENMARK? THOUSANDS OF SCENERS, A HALL FULL OF AMIGAS AND PCS, DOOM ON THE LAN AND NO SLEEP BETWEEN CHRISTMAS AND NEW YEAR... WHAT A BLAST!     " +
    "MEGA GREETINGS TO ALL MY OLD GROUP MATES - AND ESPECIALLY TO MINI AND TO ZODIAK OF CASCADA! WE STILL OWE THE SCENE ONE MORE DEMO...     " +
    "RESPECT TO SPACEBALLS - 9 FINGERS AND ITS DIGITISED DANCERS ROCKED THE PARTY 1993. THE SHADOW DANCER IN THIS DEMO IS OUR 2027 TRIBUTE!     " +
    "MUSIC: CRYSTALLINE DROP - DESIGNED BY VENTURE HIMSELF, IN PURE TRACKER MODULE STYLE. TURN IT UP LOUD!     " +
    "THIS DEMO IS A TRIBUTE TO 1993 - AND AN INVITATION: YOUNG CODERS, GRAPHIC ARTISTS, MUSICIANS AND AI WIZARDS... GIVE THE SCENE A REVIVAL! WHAT DOES THE AI DEMOSCENE LOOK LIKE IN 2027? SHOW ME WHAT AMAZING LOOKS LIKE!     " +
    "TAP LEFT OR RIGHT TO JUMP, MIDDLE TO PAUSE.     LET'S WRAP...                    ",
  greets: ["MINI","ZODIAK / CASCADA","ALL OF XANADU","AROS-D","PARAMOUNT","THE PARTY CREW","FUTURE CREW","SANITY","SPACEBALLS","KEFRENS","PHENOMENA","MELON DEZIGN","THE BLACK LOTUS","COMPLEX","ALL TRACKER HEROES"],
  journey: ["VENTURE","AROS-D","PARAMOUNT","XANADU","ONCE A SCENER..."],
  party: ["THE PARTY 1993","HERNING MESSECENTER","27-29 DECEMBER 1993","3000 SCENERS","DOOM ON THE LAN!","ZERO SLEEP","WHAT A BLAST!"],
  credits: [["MUSIC","VENTURE"],["DESIGN","VENTURE"],["CODE","CLAUDE"],["GROUP","XANADU"]]
};

/* ======================= SETUP ======================= */
const W = 320, H = 200;
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
ctx.imageSmoothingEnabled = false;
const img = ctx.createImageData(W, H);
const px = new Uint32Array(img.data.buffer);
const FONT = '"Press Start 2P", monospace';
const TAU = Math.PI * 2;
const pack = (r, g, b) => (255 << 24) | ((b & 255) << 16) | ((g & 255) << 8) | (r & 255);
const BLACK = pack(0, 0, 0);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const smooth = x => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };

function grad(stops) {
  const r = new Float32Array(256), g = new Float32Array(256), b = new Float32Array(256);
  for (let i = 0; i < 256; i++) {
    const p = i / 255; let k = 0;
    while (k < stops.length - 2 && p > stops[k + 1][0]) k++;
    const a = stops[k], c = stops[k + 1], f = (p - a[0]) / ((c[0] - a[0]) || 1);
    r[i] = a[1] + (c[1] - a[1]) * f; g[i] = a[2] + (c[2] - a[2]) * f; b[i] = a[3] + (c[3] - a[3]) * f;
  }
  return { r, g, b };
}
function buildPal(base, shift, bright, out, dim = 1) {
  for (let i = 0; i < 256; i++) {
    const j = (i + shift) & 255;
    const R = base.r[j] * dim, G = base.g[j] * dim, B = base.b[j] * dim;
    out[i] = pack(R + (255 - R) * bright, G + (255 - G) * bright, B + (255 - B) * bright);
  }
  return out;
}
const P_CRYSTAL = grad([[0,0,0,24],[0.18,10,40,150],[0.38,40,200,255],[0.5,240,255,255],[0.62,210,90,255],[0.82,90,10,150],[1,0,0,24]]);
const P_PASTEL  = grad([[0,30,15,70],[0.3,120,60,170],[0.5,255,190,225],[0.7,80,170,210],[1,30,15,70]]);
const P_FIRE    = grad([[0,0,0,0],[0.22,80,0,10],[0.42,210,30,0],[0.62,255,150,0],[0.82,255,235,90],[1,255,255,255]]);
const P_GOLD    = grad([[0,10,0,40],[0.25,70,10,160],[0.5,255,110,40],[0.72,255,240,170],[1,10,0,40]]);
const pal = new Uint32Array(256);
const shadePals = Array.from({ length: 16 }, () => new Uint32Array(256));

/* ---- textures & tables ---- */
const tex = new Uint8Array(256 * 256);
for (let y = 0; y < 256; y++) for (let x = 0; x < 256; x++) {
  const d = Math.abs((x & 63) - 32) + Math.abs((y & 63) - 32);         // diamonds
  tex[y * 256 + x] = (((x ^ y) & 127) + (d < 22 ? 128 : 0) + (d < 10 ? 64 : 0)) & 255;
}
const SIN = new Uint8Array(1024);
for (let i = 0; i < 1024; i++) SIN[i] = Math.round(Math.sin(i / 1024 * TAU) * 31.5 + 31.5);
const TW = W * 2, TH = H * 2;
const angT = new Uint8Array(TW * TH), depT = new Uint8Array(TW * TH), shT = new Uint8Array(TW * TH);
for (let y = 0; y < TH; y++) for (let x = 0; x < TW; x++) {
  const dx = x - W, dy = (y - H) * 1.2, d = Math.sqrt(dx * dx + dy * dy) || 1, i = y * TW + x;
  depT[i] = (6000 / d) & 255;
  angT[i] = ((Math.atan2(dy, dx) / TAU + 1) * 256) & 255;
  shT[i] = Math.min(15, (d / 7) | 0);
}
const heat = new Uint8Array(W * (H + 3));
const RND = new Uint8Array(65536); for (let i = 0; i < RND.length; i++) RND[i] = (Math.random() * 5) | 0;
let rndPos = 0;

/* stars */
const stars = Array.from({ length: 520 }, () => newStar(true));
function newStar(any) { return { x: (Math.random() * 2 - 1) * W, y: (Math.random() * 2 - 1) * H, z: any ? Math.random() * 255 + 1 : 256 }; }

/* bobs shapes */
const NB = 180, shapes = [[], [], []];
for (let i = 0; i < NB; i++) {
  const y = 1 - 2 * (i + .5) / NB, r = Math.sqrt(1 - y * y), ph = i * 2.39996;
  shapes[0].push([Math.cos(ph) * r, y, Math.sin(ph) * r]);
  const u = (i % 18) / 18 * TAU, v = Math.floor(i / 18) / 10 * TAU;
  shapes[1].push([(0.8 + 0.38 * Math.cos(v)) * Math.cos(u), 0.38 * Math.sin(v), (0.8 + 0.38 * Math.cos(v)) * Math.sin(u)]);
  shapes[2].push([((i % 6) / 5 * 2 - 1) * .75, ((Math.floor(i / 6) % 6) / 5 * 2 - 1) * .75, (Math.floor(i / 36) / 4 * 2 - 1) * .75]);
}
const bob = document.createElement("canvas"); bob.width = bob.height = 16;
{ const b = bob.getContext("2d"), gr = b.createRadialGradient(6, 6, 0, 8, 8, 8);
  gr.addColorStop(0, "#fff"); gr.addColorStop(.35, "#8ff"); gr.addColorStop(.75, "#46c"); gr.addColorStop(1, "rgba(20,0,80,0)");
  b.fillStyle = gr; b.fillRect(0, 0, 16, 16); }

/* gem geometry */
const GV = [], GF = [];
for (let i = 0; i < 8; i++) { const a = i / 8 * TAU; GV.push([Math.cos(a) * .55, -.5, Math.sin(a) * .55]); }
for (let i = 0; i < 8; i++) { const a = (i + .5) / 8 * TAU; GV.push([Math.cos(a), -.1, Math.sin(a)]); }
GV.push([0, 1.25, 0]);
GF.push([0, 1, 2, 3, 4, 5, 6, 7]);
for (let i = 0; i < 8; i++) { const j = (i + 1) & 7; GF.push([i, j, 8 + i]); GF.push([j, 8 + j, 8 + i]); GF.push([8 + i, 8 + j, 16]); }
{ const oc = [0, 0.2, 0];
  for (const f of GF) {
    const a = GV[f[0]], b = GV[f[1]], c = GV[f[2]];
    const n = cross(sub(b, a), sub(c, a)), fc = centroid(f.map(k => GV[k]));
    if (dot(n, sub(fc, oc)) < 0) f.reverse();
  } }
function sub(a, b) { return [a[0] - b[0], a[1] - b[1], a[2] - b[2]]; }
function cross(a, b) { return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]]; }
function dot(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; }
function centroid(ps) { const c = [0, 0, 0]; for (const p of ps) { c[0] += p[0]; c[1] += p[1]; c[2] += p[2]; } return c.map(v => v / ps.length); }
function rot(p, ax, ay, az) {
  let [x, y, z] = p, t;
  t = x * Math.cos(ay) + z * Math.sin(ay); z = -x * Math.sin(ay) + z * Math.cos(ay); x = t;
  t = y * Math.cos(ax) - z * Math.sin(ax); z = y * Math.sin(ax) + z * Math.cos(ax); y = t;
  t = x * Math.cos(az) - y * Math.sin(az); y = x * Math.sin(az) + y * Math.cos(az); x = t;
  return [x, y, z];
}

/* text canvases (built after font load) */
let atlas, logoC, maskC, maskCtx;
const mask = new Uint8Array(W * H);
function buildText() {
  { const st = [[0,[255,255,255]],[.35,[255,226,122]],[.5,[255,106,58]],[.56,[150,30,60]],[.62,[255,90,200]],[.85,[192,58,255]],[1,[90,26,160]]];
    atlas = styledAtlas(16, "scroll", f => { let k = 0; while (k < st.length - 2 && f > st[k + 1][0]) k++; const A = st[k], B = st[k + 1], u = clamp((f - A[0]) / (B[0] - A[0]), 0, 1); return A[1].map((v, i) => v + (B[1][i] - v) * u); }); }
  logoC = document.createElement("canvas"); logoC.width = W; logoC.height = 60;
  const l = logoC.getContext("2d");
  l.textAlign = "center"; l.textBaseline = "top";
  const lines = [["CRYSTALLINE", 24, 2], ["DROP", 32, 28]];
  for (const [s, sz, y] of lines) { l.font = sz + "px " + FONT; l.fillStyle = "#1a0436"; l.fillText(s, W / 2 + 3, y + 3); }
  for (const [s, sz, y] of lines) {
    l.font = sz + "px " + FONT;
    const g2 = l.createLinearGradient(0, y, 0, y + sz);
    g2.addColorStop(0, "#ffffff"); g2.addColorStop(.45, "#7ff"); g2.addColorStop(.5, "#2a3cff"); g2.addColorStop(.75, "#c47bff"); g2.addColorStop(1, "#ffffff");
    l.fillStyle = g2; l.fillText(s, W / 2, y);
  }
  crispen(logoC);
  maskC = document.createElement("canvas"); maskC.width = W; maskC.height = H;
  maskCtx = maskC.getContext("2d", { willReadFrequently: true });
}
let maskText = null;
function setMask(str) {
  if (str === maskText) return; maskText = str;
  maskCtx.clearRect(0, 0, W, H);
  const sz = str.length * 16 > 300 ? 12 : 16;
  maskCtx.font = sz + "px " + FONT; maskCtx.textAlign = "center"; maskCtx.textBaseline = "middle"; maskCtx.fillStyle = "#fff";
  maskCtx.fillText(str, W / 2, 112);
  const d = maskCtx.getImageData(0, 0, W, H).data;
  for (let i = 0; i < W * H; i++) mask[i] = d[i * 4 + 3] > 100 ? 1 : 0;
}

/* ======================= AUDIO ======================= */
const audio = new Audio(); audio.preload = "auto"; audio.setAttribute("playsinline", "");
const urls = {};
let actx = null, analyser = null, fdata = null;
let cur = null, running = false, paused = false, ended = false;
let kick = 0, avgBass = 0.3, lastBeat = -1, flash = 0, beatNo = 0, lastGrid = -1, level = 0;

async function loadTrack(id) {
  if (CFG.tracks[id].file.startsWith("data:")) { urls[id] = CFG.tracks[id].file; progress[id] = 1; showProgress(); document.getElementById("b-" + id).disabled = false; return; }
  const res = await fetch(CFG.tracks[id].file);
  if (!res.ok) throw new Error(res.status);
  const total = +res.headers.get("content-length") || 0, reader = res.body.getReader(), parts = [];
  let got = 0;
  for (;;) { const { done, value } = await reader.read(); if (done) break; parts.push(value); got += value.length; progress[id] = total ? got / total : .5; showProgress(); }
  urls[id] = URL.createObjectURL(new Blob(parts, { type: "audio/mpeg" }));
  progress[id] = 1; showProgress();
  document.getElementById("b-" + id).disabled = false;
}
const progress = { pt: 0 };
const statusEl = document.getElementById("status");
function showProgress() {
  const p = Math.round(progress.pt * 100);
  statusEl.textContent = p >= 100 ? "READY - PRESS START" : "LOADING MUSIC... " + p + "%";
}

function start(id) {
  if (!urls[id]) return;
  cur = CFG.tracks[id];
  try {
    if (!actx) {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      const src = actx.createMediaElementSource(audio);
      analyser = actx.createAnalyser(); analyser.fftSize = 1024; analyser.smoothingTimeConstant = 0.5;
      src.connect(analyser); analyser.connect(actx.destination);
      fdata = new Uint8Array(analyser.frequencyBinCount);
    }
    actx.resume();
  } catch (e) { analyser = null; }
  audio.src = urls[id]; audio.currentTime = 0;
  audio.play().catch(() => {});
  try { const s = document.getElementById("screen"); (s.requestFullscreen || s.webkitRequestFullscreen || (() => {})).call(s); } catch (e) {}
  document.getElementById("menu").style.display = "none";
  running = true; paused = false; ended = false; flash = 1; sceneIdx = -1; hiShow(false); hair = null;
}
function toMenu() {
  audio.pause(); running = false; hiShow(false);
  document.getElementById("menu").style.display = "flex";
  try { if (document.fullscreenElement) document.exitFullscreen(); } catch (e) {}
}
function togglePause() {
  if (!running || ended) return;
  paused = !paused; paused ? audio.pause() : audio.play().catch(() => {});
}
function seek(d) { if (!running) return; audio.currentTime = clamp(audio.currentTime + d, 0, (audio.duration || 999) - .5); ended = false; if (paused) togglePause(); }
audio.addEventListener("ended", () => { ended = true; });

document.getElementById("b-pt").onclick = () => start("pt");
document.getElementById("b-safe").onclick = e => { SAFE = !SAFE; e.currentTarget.textContent = "FLASHING: " + (SAFE ? "REDUCED" : "FULL"); };
document.getElementById("screen").addEventListener("pointerdown", e => {
  if (!running) return;
  if (ended) { toMenu(); return; }
  const r = cv.getBoundingClientRect(), fx = (e.clientX - r.left) / r.width;
  fx < .33 ? seek(-10) : fx > .67 ? seek(10) : togglePause();
});
addEventListener("keydown", e => {
  if (!running) { if (e.key === "1" || e.key === "Enter") start("pt"); return; }
  if (e.key === " ") { e.preventDefault(); ended ? toMenu() : togglePause(); }
  else if (e.key === "ArrowLeft") seek(-10);
  else if (e.key === "ArrowRight") seek(10);
  else if (e.key === "Escape") toMenu();
});

function analyse(t, dt) {
  let beat = false;
  if (analyser) {
    analyser.getByteFrequencyData(fdata);
    let b = 0; for (let i = 1; i <= 5; i++) b += fdata[i]; b /= 5 * 255;
    let l = 0; for (let i = 0; i < 200; i++) l += fdata[i]; level = l / (200 * 255);
    if (b > avgBass * 1.12 && b > .42 && t - lastBeat > .22) beat = true;
    avgBass += (b - avgBass) * Math.min(1, dt * 4);
  }
  const grid = Math.floor(beatOf(t));
  if ((!analyser || level === 0) && grid !== lastGrid) beat = true;
  lastGrid = grid;
  if (t < lastBeat) lastBeat = -1;
  if (beat) { kick = 1; lastBeat = t; beatNo++; }
  kick *= Math.exp(-dt * 7);
}

/* ======================= EFFECTS ======================= */
function fxStars(dt, speed) {
  px.fill(BLACK);
  for (const s of stars) {
    s.z -= speed * dt;
    if (s.z < 1) Object.assign(s, newStar(false));
    const sx = (s.x * 128 / s.z + W / 2) | 0, sy = (s.y * 128 / s.z + H / 2) | 0;
    if (sx < 0 || sx >= W - 1 || sy < 0 || sy >= H) continue;
    const c = clamp(280 - s.z, 0, 255) | 0, col = pack(c * .8, c * .9, c);
    px[sy * W + sx] = col;
    if (c > 190) px[sy * W + sx + 1] = col;
  }
}
function fxPlasma(t, base, speed, bright) {
  buildPal(base, (t * 40 * speed) | 0, bright, pal);
  const a = (t * 90 * speed) | 0, b = (t * 70 * speed) | 0, c = (t * 120 * speed) | 0, d = (t * 50 * speed) | 0;
  const rx = new Uint8Array(W), ry = new Uint8Array(H);
  for (let x = 0; x < W; x++) rx[x] = SIN[(x * 11 + a) & 1023] + SIN[(x * 6 - b) & 1023];
  for (let y = 0; y < H; y++) ry[y] = SIN[(y * 13 + c) & 1023] + SIN[(y * 5 - d + 300) & 1023];
  const e = (t * 60 * speed) | 0;
  let i = 0;
  for (let y = 0; y < H; y++) { const ryy = ry[y]; for (let x = 0; x < W; x++) px[i++] = pal[((rx[x] + ryy + SIN[((x + y) * 8 + e) & 1023]) * 2) & 255]; }
}
function fxRoto(t, base, bright) {
  buildPal(base, (t * 30) | 0, bright, pal);
  const ang = t * .45 + Math.sin(t * .3) * 1.2, zoom = .55 + .45 * Math.sin(t * .5) - kick * .12;
  const ca = Math.cos(ang) * zoom, sa = Math.sin(ang) * zoom, cx = t * 40, cy = t * 25;
  let i = 0;
  for (let y = 0; y < H; y++) {
    let u = cx - (W / 2) * ca - (y - H / 2) * sa, v = cy - (W / 2) * sa + (y - H / 2) * ca;
    for (let x = 0; x < W; x++) { px[i++] = pal[tex[(((v | 0) & 255) << 8) | ((u | 0) & 255)]]; u += ca; v += sa; }
  }
}
function fxTunnel(t, base, bright, dim = 1) {
  for (let s = 0; s < 16; s++) buildPal(base, (t * 20) | 0, bright * (1 - s / 16), shadePals[s], dim * (0.12 + s / 17));

      text(k, 70, 142 + i * 13, 8, "#ffe27a", a, "left"); text(v, 132, 142 + i * 13, 8, "#fff", a, "left");
    });
  },
  mini(t, dt, l, left) {
    fxBlobs(t); ctx.putImageData(img, 0, 0);
    text("SPECIAL GREETINGS TO", W / 2, 30, 8, "#fff", smooth(l / .8));
    ctx.globalAlpha = smooth((l - .3) / .8);
    for (let y = 0; y < 64; y++) ctx.drawImage(miniC, 0, y, W, 1, (Math.sin(y * .15 + t * 5) * (3 + kick * 8)) | 0, 58 + y, W, 1);
    ctx.globalAlpha = 1;
    text("MY OLD MATE", W / 2, 130, 8, "#ffe27a", smooth((l - 1) / .8));
    text("FRIENDS FOREVER · VENTURE", W / 2, 150, 8, "#9ff", smooth((l - 2) / .8));
  },
  finale(t, dt, l) {
    fxRoto(t * 1.4, P_CRYSTAL, kick * .45); ctx.putImageData(img, 0, 0);
    if (kick > .9) flash = Math.max(flash, .35);
    logo(2, t, 4 + kick * 8); drawGem(t * 1.5, .8, W / 2, 112); scroller(t, 170, 8);
  },
  end(t, dt, l) { sceneEnd(t, dt, l); }
};

let sceneIdx = -1, last = performance.now(), endT = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (!running) { idle(now / 1000, dt); return; }
  if (paused) { text("PAUSED", W / 2, 92, 16, "#fff"); return; }
  let t = audio.currentTime; tNow = t;
  if (ended) { endT += dt; t = (audio.duration || t) + endT; } else endT = 0;
  analyse(t, dt);
  const cues = cur.cues; let i = 0;
  while (i < cues.length - 1 && t >= cues[i + 1][0]) i++;
  if (i !== sceneIdx) { if (sceneIdx >= 0) flash = 1; sceneIdx = i; }
  const local = t - cues[i][0], left = (cues[i + 1] ? cues[i + 1][0] : t + 99) - t;
  if (cues[i][1] !== "dancer" && cues[i][1] !== "end") hiShow(false, true);
  FX[cues[i][1]](t, dt, local, left);
  if (SAFE) flash = Math.min(flash, .12);
  if (flash > .01) { ctx.fillStyle = `rgba(255,255,255,${flash})`; ctx.fillRect(0, 0, W, H); flash *= Math.exp(-dt * 7); }
}
function idle(t, dt) { if (window.__hold) return; fxPlasma(t, P_CRYSTAL, .3, 0); ctx.putImageData(img, 0, 0); }

/* ======================= BOOT ======================= */
(async () => {
  try { await Promise.race([document.fonts.load('16px "Press Start 2P"'), new Promise(r => setTimeout(r, 3000))]); } catch (e) {}
  buildText(); buildBump(); buildMini();
  requestAnimationFrame(frame);
  showProgress();
  for (const id of ["pt"]) loadTrack(id).catch(() => { statusEl.textContent = "COULD NOT LOAD " + CFG.tracks[id].name; });
})();
/* debug hook for previews: ?scene not allowed, so expose a function */
window.__demo = { FX, setCur: id => { cur = CFG.tracks[id]; }, frameAt(t, name) { kick = .6; tNow = t; ctx.clearRect(0, 0, W, H); FX[name](t, 1 / 60, t - 0, 10); } };
</script>
