  notes: >
    Venture set the brief (a Gothic cathedral brought to life at a techno party: lasers, strobes,
    haze, drones, angels and demons, kings and commoners) and directed the build. Claude researched
    cathedral architecture and iconography (rose windows, rib vaults, gargoyles, the Last Judgment,
    the dance of death, the Feast of Fools), wrote all code and visuals by hand in WebGL2 (no image
    or video generation), measured the bar grid and kick timeline from the track offline, and tested
    in headless Chromium. The music is "Mon dieu bebe", a VoxNoir production generated with Suno,
    supplied by Venture and used unedited.
