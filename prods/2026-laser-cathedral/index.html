// The beam: each instance is one segment; the fragment computes the exact
// integral of a gaussian spot moving along the segment -> seamless joins.
const beamP=prog(`#version 300 es
layout(location=0) in vec2 q; layout(location=1) in vec4 seg; layout(location=2) in vec4 cw;
uniform float uAsp; uniform float uPx;
out vec2 vP; flat out vec2 vA; flat out vec2 vB; flat out vec3 vC; flat out float vW;
void main(){
  vec2 a=seg.xy,b=seg.zw,d=b-a; float L=length(d); vec2 t=L>1e-6?d/L:vec2(1,0); vec2 n=vec2(-t.y,t.x);
  float w=max(cw.w,uPx*1.1); float e=w*3.2;
  vec2 P=mix(a-t*e,b+t*e,q.x)+n*e*q.y;
  vP=P;vA=a;vB=b;vC=cw.rgb;vW=w; gl_Position=vec4(P.x/uAsp,P.y,0,1);
}`,`#version 300 es
precision highp float;
in vec2 vP; flat in vec2 vA; flat in vec2 vB; flat in vec3 vC; flat in float vW; out vec4 o; uniform float uBG;
float erf(float x){float s=sign(x),a=abs(x);float t=1.+(0.278393+(0.230389+(0.000972+0.078108*a)*a)*a)*a;t*=t;return s-s/(t*t);}
float beam(float al,float pe,float L,float s){
  if(L<1e-6) return exp(-(al*al+pe*pe)/(s*s));
  return exp(-pe*pe/(s*s))*(erf(al/s)-erf((al-L)/s))*.5;}
void main(){
  vec2 ba=vB-vA; float L=length(ba); vec2 t=L>1e-6?ba/L:vec2(1,0); vec2 pa=vP-vA;
  float al=dot(pa,t), pe=dot(pa,vec2(-t.y,t.x));
  float g=beam(al,pe,L,vW)*.55 + beam(al,pe,L,vW*.33)*1.1 + beam(al,pe,L,vW*2.6)*.07;
  o=vec4(vC*g*uBG,1);
}`);

   case 3:if(bar%2===1&&ib>=3)a=fract(ib*2)<.36?.9:0;else if(ib<.05)a=.2;break;
   case 5:if(Math.floor(lb)%4===3&&ib>=3)a=fract(ib*4)<.3?.8:0;else if(ib<.04)a=.16;break;
   case 6:a=(fract(bt*2)>.5&&fract(bt*2)<.555)?.24:0;break;
   case 7:if(Math.floor(lb)%4===3&&ib>=3)a=fract(ib*4)<.3?.8:0;break;
   case 8:if(lb>=6&&ib>=3)a=fract(ib*2)<.36?.8:(ib<.05?.2:0);else if(ib<.05)a=.18;break;
   case 10:{const u=lt/(2*BAR);a=fract(bt*(1+u*u*11))<.26?.3+.55*u:0;if(lt>2*BAR-.28)a=1;break}
   case 11:if(Math.floor(lb)%4===3&&ib>=3)a=fract(ib*4)<.3?.85:0;else if(ib<.06)a=.32;break;
   case 12:if(lb>=5&&ib>=2.5)a=fract(ib*2)<.36?.8:0;else if(ib<.05)a=.25;break;
   case 13:if(lb>=5.35){a=fract(bt*2)<.42?.7:0;}if(lt>6*BAR-.1)a=1;break;
   case 14:a=0;break}
  return a*(CALM?.15:1)}
function hud(T,si,lt){const S=SEC[si];if(!S.n)return;const a=sstep(0,.6,lt)*(1-sstep(4.6,6.4,lt));if(a<.01)return;
  const x0=-ASP+.1;wid(.0022);col(1.3*a,.95*a,.4*a);text(S.r+'  '+S.n,x0,-.9,.032,{p:sstep(0,1.1,lt)});col(.8*a,.8*a,1.1*a);wid(.0018);text(S.en,x0,-.955,.02,{p:sstep(.3,1.4,lt)});
  col(.6*a,.5*a,.2*a);wid(.002);mv(x0,-.855);ln(x0+.55*sstep(0,1,lt),-.855)}

let last=performance.now(),cur=0,lastSec=-1,prm={dec:.8,z:1};
function drawScene(si,T,lt,dt){FY=1;MIR=1;FOG=.05;SCN[si]({t:T,lt,b:lt/BAR,dt,k:PU,si})}
function frame(now){requestAnimationFrame(frame);let dt=Math.min(.05,(now-last)/1000);last=now;resize();
  if(FAKE&&state==='play'&&!paused)fakeClock+=dt;if(paused)dt=0;
  const playing=state==='play'||state==='end';let T=playing?songT():0;gT=T;
  analyze(T,dt,playing);
  TG=tHud;tHud.n=0;tMain.n=0;GAIN=1;FY=1;MIR=1;
  let si=0,lk=LOOK[0],fade=1;
  if(playing){si=secIdx(T);const S=SEC[si],lt=Math.max(0,T-S.t);lk=LOOK[si];
    PU=clamp(Math.max(F.kick*.9,S.e>=.6?F.beat*.85:0)*Math.min(1,S.e+.25));
    if(si!==lastSec){if(S.cut&&lastSec>=0){shock(1.5,S.t);F.flash=CALM?.25:1.0;FX.shake=CALM?0:.05}lastSec=si}
    if(F.bigTrig&&S.e>=.9&&T-FX.st>.8)shock(.5,T);
    FX.age=T-FX.st;if(FX.age<0)FX.age=99;FX.shake*=Math.exp(-dt*6);
    TG=tMain;
    const XF=BEAT*2;
    if(si>0&&!S.cut&&lt<XF){const m=sstep(0,XF,lt);GAIN=1-m;drawScene(si-1,T,T-SEC[si-1].t,dt);GAIN=m;drawScene(si,T,lt,dt);GAIN=1}
    else drawScene(si,T,lt,dt);
    TG=tHud;GAIN=1;hud(T,si,lt);
    FX.strobe=strobeAmt(T,si,lt);FX.punch=PU*(S.e>=.6?.85:.3)*(CALM?.2:1);FX.split=PU*.35*(CALM?.2:1)+(F.flash>.3?.25:0);
    prm.dec=S.dec;prm.z=lk.z;
    fade=sstep(0,1.4,T)*(1-sstep(END-1.6,END,T));
    if(T>END+.4&&state==='end'){TG=tHud;col(.9,.8,.4);wid(.0026);text('PRESS R TO REPLAY',0,0,.035,{c:1,p:sstep(END+.4,END+1.4,T)})}
  }else{
    TG=tMain;const p=.7+.3*Math.sin(now/260);flame(0,-.1,1.4,now/1000,1);
    col(1.4*p,.9*p,.35*p);wid(.0038);
    if(state==='load')caption('RECEIVING THE LIGHT  '+Math.floor(loadP*100)+'%',0,-.5,.034,1,PAL.gold,.8);
    else if(state==='decode')caption('TUNING THE ORGAN ...',0,-.5,.034,1,PAL.gold,.8);
    else{caption('CLICK TO ENTER THE CATHEDRAL',0,-.5,.036,1,PAL.gold,.95);title('LASER CATHEDRAL',0,.42,.1,1,PAL.gold,1.25);
      caption('WARNING: FLASHING LIGHTS AND STROBING',0,-.68,.024,1,PAL.ruby,.8);caption('M = REDUCED FLASHING    F = FULLSCREEN    HEADPHONES RECOMMENDED',0,-.76,.02,1,PAL.ice,.6)}
    prm.dec=.8;prm.z=1;PU=0;FX.strobe=0;FX.punch=0;FX.split=0;FX.age=99;fade=1}
  render(dt,now,lk,fade)}

function bindTex(u,t,unit){gl.activeTexture(gl.TEXTURE0+unit);gl.bindTexture(gl.TEXTURE_2D,t);gl.uniform1i(u,unit)}
function quad(){gl.bindVertexArray(vaoQ);gl.drawArrays(gl.TRIANGLE_STRIP,0,4)}
function beams(fbo,t,bg){gl.bindFramebuffer(gl.FRAMEBUFFER,fbo.f);gl.viewport(0,0,W,H);gl.clearColor(0,0,0,1);gl.clear(gl.COLOR_BUFFER_BIT);
  if(t.n){gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE);gl.useProgram(beamP.p);gl.uniform1f(beamP.u.uAsp,ASP);gl.uniform1f(beamP.u.uPx,2/H);gl.uniform1f(beamP.u.uBG,bg);
    gl.bindBuffer(gl.ARRAY_BUFFER,instBuf);gl.bufferSubData(gl.ARRAY_BUFFER,0,t.d,0,t.n*8);
    gl.bindVertexArray(vaoB);gl.drawArraysInstanced(gl.TRIANGLE_STRIP,0,4,t.n);gl.disable(gl.BLEND)}}
function render(dt,now,lk,fade){
  beams(ovl,tHud,1);beams(fresh,tMain,1);
  const k=dt*60,dec=Math.pow(prm.dec,k),z=Math.pow(prm.z,k);
  const A=trail[cur],B=trail[1-cur];cur=1-cur;
  gl.bindFramebuffer(gl.FRAMEBUFFER,B.f);gl.useProgram(fbP.p);bindTex(fbP.u.uPrev,A.t,0);bindTex(fbP.u.uFresh,fresh.t,1);
  gl.uniform1f(fbP.u.uDecay,dec);gl.uniform1f(fbP.u.uZoom,z);gl.uniform1f(fbP.u.uRot,0);gl.uniform1f(fbP.u.uAsp,ASP);quad();
  gl.viewport(0,0,b1.w,b1.h);gl.bindFramebuffer(gl.FRAMEBUFFER,b1.f);gl.useProgram(downP.p);bindTex(downP.u.uT,B.t,0);gl.uniform2f(downP.u.uTx,1/W,1/H);quad();
  gl.useProgram(blurP.p);
  for(let it=0;it<2;it++){gl.bindFramebuffer(gl.FRAMEBUFFER,b2.f);bindTex(blurP.u.uT,b1.t,0);gl.uniform2f(blurP.u.uD,1.4/b1.w,0);quad();
    gl.bindFramebuffer(gl.FRAMEBUFFER,b1.f);bindTex(blurP.u.uT,b2.t,0);gl.uniform2f(blurP.u.uD,0,1.4/b1.h);quad()}
  gl.viewport(0,0,b3.w,b3.h);gl.bindFramebuffer(gl.FRAMEBUFFER,b3.f);gl.useProgram(downP.p);bindTex(downP.u.uT,b1.t,0);gl.uniform2f(downP.u.uTx,1/b1.w,1/b1.h);quad();
  gl.useProgram(blurP.p);
  for(let it=0;it<2;it++){gl.bindFramebuffer(gl.FRAMEBUFFER,b4.f);bindTex(blurP.u.uT,b3.t,0);gl.uniform2f(blurP.u.uD,1.5/b3.w,0);quad();
    gl.bindFramebuffer(gl.FRAMEBUFFER,b3.f);bindTex(blurP.u.uT,b4.t,0);gl.uniform2f(blurP.u.uD,0,1.5/b3.h);quad()}
  gl.viewport(0,0,1,1);gl.bindFramebuffer(gl.FRAMEBUFFER,exF.f);gl.useProgram(exP.p);bindTex(exP.u.uT,b3.t,0);quad();
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.viewport(0,0,W,H);gl.useProgram(finP.p);
  bindTex(finP.u.uA,B.t,0);bindTex(finP.u.uB1,b1.t,1);bindTex(finP.u.uB2,b3.t,2);bindTex(finP.u.uO,ovl.t,3);bindTex(finP.u.uEx,exF.t,4);
  const u=finP.u;gl.uniform2f(u.uRes,W,H);gl.uniform1f(u.uT,now/1000);gl.uniform1f(u.uPunch,FX.punch);gl.uniform1f(u.uShock,FX.age);gl.uniform1f(u.uShockA,FX.sa);gl.uniform1f(u.uSplit,FX.split);
  gl.uniform2f(u.uShake,(Math.random()-.5)*FX.shake,(Math.random()-.5)*FX.shake);gl.uniform1f(u.uHaze,lk.h);gl.uniform1f(u.uRays,lk.r*(CALM?.6:1));gl.uniform2f(u.uLight,lk.lx,lk.ly);gl.uniform3fv(u.uFog,lk.f);
  gl.uniform1f(u.uStrobe,FX.strobe);gl.uniform1f(u.uFlash,F.flash);gl.uniform1f(u.uFade,fade);gl.uniform1f(u.uBloom,1);quad()}

// ---------------------------------------------------------------- loading + controls
function say(m){document.getElementById('err').textContent=m}
async function loadTrack(){
  if(FAKE){state='ready';return}
  try{const r=await fetch('track.mp3');if(!r.ok)throw new Error(r.status);
    const len=+r.headers.get('content-length')||4885220;const rd=r.body.getReader();const chunks=[];let got=0;
    for(;;){const{done,value}=await rd.read();if(done)break;chunks.push(value);got+=value.length;loadP=Math.min(.99,got/len)}
    const ab=new Uint8Array(got);let o=0;for(const c of chunks){ab.set(c,o);o+=c.length}
    window._ab=ab.buffer;state='ready';loadP=1}
  catch(e){say('Could not fetch track.mp3 (opened via file://?). Click to choose the MP3, or drop it here.');state='ready';window._needFile=true}}
async function powerOn(){if(state!=='ready')return;
  if(window._needFile&&!window._ab){document.getElementById('f').click();return}
  state='decode';
  if(!FAKE){setupAudio();await AC.resume();
    try{buf=await AC.decodeAudioData(window._ab.slice(0))}catch(e){state='ready';window._ab=null;window._needFile=true;say('Could not decode the track. Click to choose the MP3, or drop it here.');return}
    playFrom(T0)}else fakeClock=T0;
  state='play'}
const takeFile=async f=>{if(!f)return;window._ab=await f.arrayBuffer();window._needFile=false;say('');powerOn()};
document.getElementById('f').addEventListener('change',e=>takeFile(e.target.files[0]));
addEventListener('dragover',e=>e.preventDefault());addEventListener('drop',e=>{e.preventDefault();takeFile(e.dataTransfer.files[0])});
cv.addEventListener('click',()=>{if(state==='ready')powerOn()});
function seek(t){t=clamp(t,0,END-.5);kPrevT=-9;F.kick=0;trail.forEach(o=>{gl.bindFramebuffer(gl.FRAMEBUFFER,o.f);gl.clear(gl.COLOR_BUFFER_BIT)});lastSec=-1;
  if(FAKE)fakeClock=t;else if(buf)playFrom(t);state='play'}
addEventListener('keydown',e=>{
  if(e.key==='m'||e.key==='M')CALM=!CALM;
  if(e.key==='f'||e.key==='F'){try{const r=!document.fullscreenElement?document.documentElement.requestFullscreen?.():document.exitFullscreen?.();r&&r.catch&&r.catch(()=>{})}catch(_){}}
  if(state!=='play'&&state!=='end'){if(e.key===' '||e.key==='Enter')powerOn();if((e.key==='r'||e.key==='R')&&state==='end')seek(0);return}
  if(e.key===' '){paused=!paused;if(AC)paused?AC.suspend():AC.resume()}
  if(e.key==='ArrowRight')seek(songT()+5);if(e.key==='ArrowLeft')seek(songT()-5);
  if(e.key==='r'||e.key==='R')seek(0);
  if(/^[0-9]$/.test(e.key)){const i=e.key==='0'?9:+e.key-1;seek(SEC[i].t+.1)}
  if(e.key===']'||e.key==='['){const i=secIdx(songT())+(e.key===']'?1:-1);seek(SEC[clamp(i,0,SEC.length-2)].t+.1)}
  if(e.key==='c'||e.key==='C')seek(SEC[13].t+.1)});
loadTrack();
if(FAKE&&Q.has('auto')){state='play';fakeClock=T0}
requestAnimationFrame(frame);
