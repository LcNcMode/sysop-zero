/* ===================== timeline ===================== */
const flash = { v: 0 };
let lastScene = "";

function runScene(sc, tt, dt) { // render one scene into sceneF at song time tt (may run a little outside its own bars during a dissolve)
  const x = mBar(tt) - sc.n0, d = sc.map(x), tD = OFF + (sc.d0 - 1 + d) * BAR;
  const C = clock(Math.min(tt, SONG_END), sc); C.tt = tD; C.x = x; C.rt = tt;

}
let xT = null, xF = null, mixT = null, mixF = null, xW = 0, xH = 0;
function ensureX() { if (xW === RW && xH === RH && xT) return; xW = RW; xH = RH; xT = tex(RW, RH, true); xF = fbo(xT); mixT = tex(RW, RH, true); mixF = fbo(mixT); }

/* ===================== audio (plain <audio>: plays even with the iPhone silent switch on) ===================== */
const audio = new Audio(); audio.preload = "auto"; audio.setAttribute("playsinline", ""); audio.src = "ai-tracker-edition.mp3";

const statusEl = document.getElementById("status");
