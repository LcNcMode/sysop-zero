# Posts the drift report from "Prod check" as a single, updated PR comment.
# Split from prod-check.yml so fork PRs never get a write token: this workflow runs
# in the base repo context and only reads the uploaded artifact as data.
name: Drift comment
on:
  workflow_run:
    workflows: ["Prod check"]
    types: [completed]
permissions:
  contents: read
jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      pull-requests: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: drift-report
          path: drift-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          script: |
            const fs = require('fs');
            const raw = fs.readFileSync('drift-report/pr_number', 'utf8').trim();
            if (!/^\d+$/.test(raw)) { core.setFailed(`invalid PR number: ${raw}`); return; }
            const issue_number = Number(raw);
            const { owner, repo } = context.repo;
            // The artifact is untrusted: only comment if the PR really is at the commit that was checked.
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: issue_number });
            if (pr.head.sha !== process.env.HEAD_SHA) { core.notice('PR moved on since this run; skipping comment.'); return; }
            const MARK = '<!-- sysop-zero:drift-report -->';
            let body = fs.readFileSync('drift-report/report.md', 'utf8');
            if (!body.startsWith(MARK)) body = MARK + '\n' + body;
            if (body.length > 60000) body = body.slice(0, 60000) + '\n\n_report truncated, see the workflow summary_';
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const mine = comments.find(c => c.user.type === 'Bot' && c.body.startsWith(MARK));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
