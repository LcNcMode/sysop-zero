# Validates every prod (schema, build, size budget), reports drift between declared
# (prod.yaml) and observed facts, and proves the checks still fire on deliberately broken
# fixtures. Runs with a read-only token, so it is safe for fork PRs; the report is posted
# as a PR comment by drift-comment.yml.
#
# Two jobs, two kinds of trust:
#  - check:    the verdict on a PR's *data* (prods/, CODEOWNERS). It runs the checking code
#              (scripts/, tests/) from the base branch, not from the PR, so a PR cannot raise
#              its own size budget, loosen the schema or rewrite prodcheck.py to pass.
#  - selftest: the PR's *own* scripts and self-tests, so changes to the tooling are tested too.
# Both are required checks (ruleset main-checks). Keep the job ids stable, or update
# scripts/setup-repo.sh and re-apply it in the same change.
#
# Limit: on pull_request, GitHub runs the workflow file from the PR itself, so a PR that
# edits this file can change what runs. The drift report flags every PR that touches
# .github/, scripts/ or tests/; review those as code changes, never as prod releases.
name: Prod check
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: prod-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Make sure the PR did not ship its own .trusted/ folder
        if: github.event_name == 'pull_request'
        run: rm -rf .trusted
      - name: Check out the checking code from the base branch
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .trusted
          persist-credentials: false
      - name: Use the base branch's scripts/ and tests/ (PR data stays as it is)
        if: github.event_name == 'pull_request'
        run: |
          : > tooling-changes.txt
          for p in scripts tests .github; do
            diff -rq ".trusted/$p" "$p" 2>/dev/null | sed -E \
              -e 's#^Files \.trusted/(.*) and .* differ$#changed: \1#' \
              -e 's#^Only in \.trusted/([^:]*): (.*)$#removed: \1/\2#' \
              -e 's#^Only in ([^:]*): (.*)$#added:   \1/\2#' >> tooling-changes.txt || true
          done
          rm -rf scripts tests
          cp -r .trusted/scripts .trusted/tests .
          rm -rf .trusted
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - name: Validate, build and measure prods
        id: prods
        run: python3 scripts/prodcheck.py --report prods-report.md --json prods-report.json --site-out _site
      - name: Self-test — drift detector must fire on the broken fixture
        if: always()
        run: python3 scripts/prodcheck.py --prods tests/fixtures/prods --title "Self-test (deliberately broken fixture, expected to fail)" --report selftest-report.md --expect-findings
      - name: CODEOWNERS in sync with prod.yaml
        if: always()
        run: python3 scripts/gen_codeowners.py --check
      - name: Portability — no hardcoded owner name
        if: always()
        env:
          OWNER: ${{ github.repository_owner }}
        run: scripts/check_portability.sh "$OWNER"
      - name: Assemble drift report
        if: always()
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          OUTCOME: ${{ steps.prods.outcome }}
        run: |
          mkdir -p drift-report
          {
            echo "<!-- sysop-zero:drift-report -->"
            echo "## 📡 Sysop Zero — drift report"
            echo
            if [ -s tooling-changes.txt ]; then
              echo "> [!WARNING]"
              echo "> This PR changes checking code or automation (\`scripts/\`, \`tests/\` or \`.github/\`)."
              echo "> The verdict below used the base branch's checks; the \`selftest\` job runs the PR's own."
              echo "> Review it as a code change, not as a prod release."
              echo
              echo "<details><summary>Changed paths</summary>"
              echo
              echo '```'
              head -n 50 tooling-changes.txt
              echo '```'
              echo
              echo "</details>"
              echo
            fi
            echo "Declared = \`prod.yaml\` (human-owned). Observed = measured by CI. Mismatches are drift."
            echo
            cat prods-report.md 2>/dev/null || echo "_prod check did not produce a report (outcome: ${OUTCOME})_"
            echo
            echo "<details><summary>Self-test: the detector still fires on <code>tests/fixtures/prods</code></summary>"
            echo
            cat selftest-report.md 2>/dev/null || echo "_no self-test report_"
            echo
            echo "</details>"
          } > drift-report/report.md
          echo "${PR_NUMBER}" > drift-report/pr_number
          cat drift-report/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && github.event_name == 'pull_request'
        with:
          name: drift-report
          path: drift-report/
          retention-days: 7

  selftest:
    # The PR's own tooling: its scripts must pass on the prods and on every fixture.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - name: Prods pass with the PR's own scripts
        run: python3 scripts/prodcheck.py --site-out _site
      - name: Every published prod page starts with the sandbox guard
        # Position matters, not just presence: the guard must be the first thing the parser runs.
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          ok = re.compile(rb"^(\xef\xbb\xbf)?([ \t\r\n]*<!doctype[ \t\r\n]+html[ \t\r\n]*>)?<script>/\* sysop-zero: run only inside the gallery sandbox \*/", re.I)
          pages = [p for p in pathlib.Path("_site/prods").rglob("*") if p.is_file() and p.suffix.lower() in (".html", ".htm")]
          bad = [p for p in pages if not ok.match(p.read_bytes())]
          for p in bad:
              print(f"::error file={p}::the sandbox guard is not the first thing on the page")
          print(f"{len(pages)} published page(s) checked")
          sys.exit(1 if bad or not pages else 0)
          PY
      - name: Drift detector fires on the broken fixture
        if: always()
        run: python3 scripts/prodcheck.py --prods tests/fixtures/prods --expect-findings
      - name: Triage gives the expected answer on every fixture issue
        if: always()
        run: python3 scripts/triage.py --self-test
      - name: Intake refuses unsafe zips and builds good ones
        if: always()
        run: python3 scripts/intake.py --self-test
      - name: CODEOWNERS in sync with prod.yaml
        if: always()
        run: python3 scripts/gen_codeowners.py --check
      - name: Portability — no hardcoded owner name
        if: always()
        env:
          OWNER: ${{ github.repository_owner }}
        run: scripts/check_portability.sh "$OWNER"
