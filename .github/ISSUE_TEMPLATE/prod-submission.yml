name: Prod submission
description: Release a prod on Sysop Zero (demo, intro, music or gfx).
title: "[prod] <title> by <handle>"
labels: [prod-submission]
body:
  - type: markdown
    attributes:
      value: |
        **Welcome, scener.** No git needed: fill this in and save. Within a minute Sysop Zero
        replies with what's missing, or a draft `prod.yaml` when everything is in place.
        Edit the issue any time and it checks again.

        **Handles only — no legal names, emails or photos.** At home in git? A pull request
        works too (see docs/CONTRIBUTING.md).
  - type: input
    id: prod_title   # not "title": GitHub uses that URL parameter for the issue's own title
    attributes: { label: Prod title, description: "The name of your prod: the demo, intro, tune or picture. Not your own name." }
    validations: { required: true }
  - type: input
    id: group
    attributes: { label: Group, description: "The crew releasing it. Solo? Use your own handle." }
    validations: { required: true }
  - type: input
    id: handles
    attributes: { label: Handles, description: "Scene names of the people who made it, comma-separated. AI tools are not handles: they go under 'AI models and tools used' below." }
    validations: { required: true }
  - type: dropdown
    id: category
    attributes:
      label: Category
      description: "Music can be a tracker module or an audio file (MP3, OGG, FLAC, WAV). AI-generated work is welcome, just declare it below."
      options: [demo, intro-4k, intro-64k, music, gfx]
    validations: { required: true }
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [web, amiga, dos, windows, linux, macos, c64, atari-st, zx-spectrum, other]
    validations: { required: true }
  - type: dropdown
    id: provenance
    attributes:
      label: Provenance
      description: "Who made it? See docs/PROVENANCE.md. Honest declaration is the only rule that matters."
      options: [human, ai, hybrid]
    validations: { required: true }
  - type: textarea
    id: models
    attributes:
      label: AI models and tools used
      description: "One per line, with what each did (e.g. 'Model X — shader code'). Required for ai/hybrid."
  - type: input
    id: year
    attributes: { label: Year, description: "Release year, or the year the prod is styled as (explain in notes)." }
    validations: { required: true }
  - type: input
    id: license
    attributes: { label: License, description: "SPDX id. Default: CC-BY-NC-SA-4.0." , value: CC-BY-NC-SA-4.0 }
    validations: { required: true }
  - type: input
    id: party
    attributes: { label: Party (optional) }
  - type: textarea
    id: link
    attributes: { label: "Where are the files?", description: "Drag a .zip of your prod in here, and Sysop Zero opens the pull request for you. Or paste a link to a fork branch or release (a maintainer fetches it)." }
    validations: { required: true }
  - type: textarea
    id: notes
    attributes: { label: Notes / nfo }
  - type: checkboxes
    id: terms
    attributes:
      label: Release terms
      options:
        - label: I have the right to release everything in this prod under the license above (including music, samples, fonts and AI output under the tools' terms).
          required: true
        - label: I declared AI use honestly.
          required: true
        - label: I follow the Code of Conduct.
          required: true
