<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My First Prod</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="c" width="320" height="200"></canvas>
<script>
// Hello, scener. A tiny 320x200 plasma to start from. Replace it with your own magic.
// Keep everything inside this folder and load assets with relative URLs.
const c = document.getElementById("c"), g = c.getContext("2d");
const img = g.createImageData(c.width, c.height);
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
function frame(t) {
  const s = reduced ? 0 : t / 1000, d = img.data;
  for (let y = 0, i = 0; y < c.height; y++) {
    for (let x = 0; x < c.width; x++, i += 4) {
      const v = Math.sin(x / 16 + s) + Math.sin(y / 11 - s) + Math.sin((x + y) / 23 + s * 0.7);
      d[i] = 128 + 127 * Math.sin(v * Math.PI);
      d[i + 1] = 128 + 127 * Math.sin(v * Math.PI + 2);
      d[i + 2] = 128 + 127 * Math.sin(v * Math.PI + 4);
      d[i + 3] = 255;
    }
  }
  g.putImageData(img, 0, 0);
  g.fillStyle = "#fff"; g.font = "16px monospace"; g.textAlign = "center";
  g.fillText("HELLO, SCENE", c.width / 2, c.height / 2);
  if (!reduced) requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
